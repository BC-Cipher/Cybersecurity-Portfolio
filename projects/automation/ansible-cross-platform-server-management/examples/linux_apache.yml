---
- name: Configure Apache on Ubuntu
  hosts: webserver
  become: true
  tasks:
    - name: Ensure Apache is installed
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: true

    - name: Ensure Apache is running and starts on boot
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Publish a basic verification page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Apache Test</title></head>
          <body><h1>Apache deployment verified</h1></body>
          </html>
        owner: root
        group: root
        mode: '0644'
