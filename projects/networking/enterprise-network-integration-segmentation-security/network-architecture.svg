<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Simplified network integration architecture</title>
<desc id="desc">The primary office has an ASA firewall, routers R1, R2, and R3, segmented switches, and a routed connection to the external network. Orlando and the data center connect separately to the same simulated external router, representing the risk identified in the security review.</desc>
