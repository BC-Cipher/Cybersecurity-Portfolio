<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
<title id="title">Segmented network with five VLANs, IoT devices, and simulated Internet access</title>
<desc id="desc">Cisco Packet Tracer architecture: a simulated Internet server is reached through an ISP router and fiber connection to local router R1. Router R1 connects to switch S1. S1 connects to S2 by an 802.1Q trunk. S1 serves VLANs 10, 20, and 50, including a wireless IoT access point. S2 serves VLANs 30 and 40.</desc>
