<text x="52" y="60" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#14283f">Segmented Network Architecture</text>
<text x="52" y="83" font-family="Arial,sans-serif" font-size="13" fill="#556879">Cisco Packet Tracer simulation | Five active VLANs | Fiber ISP connection</text>
